<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rescue Arc — Alert Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #12181b;
    --panel: #1a2226;
    --border: #2a3439;
    --text: #e7edf0;
    --muted: #8fa3ab;
    --accent: #d94f3d;
    --ok: #4caf7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 60px 20px;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 480px; }
  header { margin-bottom: 28px; }
  header .tag {
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  h1 { font-size: 24px; margin: 6px 0 4px; }
  header p { color: var(--muted); font-size: 14px; margin: 0; }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px;
  }
  label {
    display: block;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  select {
    width: 100%;
    background: #0f1417;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 11px 12px;
    font-size: 15px;
    margin-bottom: 18px;
  }
  select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: default; }
  .result {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 13.5px;
    display: none;
    white-space: pre-wrap;
  }
  .result.show { display: block; }
  .result.ok { background: rgba(76,175,125,0.12); border: 1px solid rgba(76,175,125,0.35); color: var(--ok); }
  .result.err { background: rgba(217,79,61,0.12); border: 1px solid rgba(217,79,61,0.35); color: var(--accent); }
  .config {
    font-size: 12px;
    color: var(--muted);
    margin-top: 20px;
    text-align: center;
  }
  .config code { color: var(--text); }
</style>
</head>
<body>
<main>

  <header>
    <div class="tag">RESCUE ARC — INTERNAL</div>
    <h1>Alert reset</h1>
    <p>Pick a region, reset it, let the poller send the real alert.</p>
  </header>

  <section>
    <label for="regionSelect">Region</label>
    <select id="regionSelect"><option>Loading…</option></select>
    <button id="resetBtn">Reset alerts for this region</button>
    <div id="resetResult" class="result"></div>
  </section>

  <div class="config">
    Backend: <code id="apiBaseDisplay"></code>
  </div>

</main>

<script>
  // === Point this at your deployed/local backend ===
  const API_BASE = "http://127.0.0.1:8000";
  document.getElementById("apiBaseDisplay").textContent = API_BASE;

  const regionSelect = document.getElementById("regionSelect");
  const resetBtn = document.getElementById("resetBtn");
  const resetResult = document.getElementById("resetResult");

  function showResult(ok, text) {
    resetResult.textContent = text;
    resetResult.className = "result show " + (ok ? "ok" : "err");
  }

  async function loadRegions() {
    regionSelect.innerHTML = `<option>Loading…</option>`;
    try {
      const res = await fetch(`${API_BASE}/api/regions`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Request failed");
      if (!data.length) {
        regionSelect.innerHTML = `<option value="">No regions found</option>`;
        return;
      }
      // NOTE: value uses display_name, assumed to match habitations.region text.
      // If your regions.region_id is what actually matches, change r.display_name
      // to r.region_id on the line below.
      regionSelect.innerHTML = data
        .map(r => `<option value="${r.region_id}">${r.display_name}</option>`)
        .join("");
    } catch (err) {
      regionSelect.innerHTML = `<option value="">Failed to load</option>`;
      showResult(false, `Couldn't load regions: ${err.message}`);
    }
  }

  resetBtn.addEventListener("click", async () => {
    const region = regionSelect.value;
    if (!region) {
      showResult(false, "Pick a region first.");
      return;
    }
    resetBtn.disabled = true;
    resetBtn.textContent = "Resetting…";
    try {
      const res = await fetch(`${API_BASE}/api/reset-region-alerts`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ region })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Request failed");
      showResult(true, `Reset ${data.reset_count} habitation(s) in ${data.region}. Watch for the real push within 5s.`);
    } catch (err) {
      showResult(false, `Failed: ${err.message}`);
    } finally {
      resetBtn.disabled = false;
      resetBtn.textContent = "Reset alerts for this region";
    }
  });

  loadRegions();
</script>

</body>
</html>
